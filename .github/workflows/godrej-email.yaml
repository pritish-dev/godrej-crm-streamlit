name: CRM Pending Delivery Alerts

on:
  schedule:
    # All times UTC.  IST = UTC + 5:30
    # CRM mail goes out only after 9 PM IST — one alert a night (was 7 AM + 4 PM).
    - cron: '35 15 * * *'   # 09:05 PM IST  →  nightly alert (SLOT=morning subject)

  workflow_dispatch:
    inputs:
      slot:
        description: 'Which subject to send (morning = Pending Delivery Alerts, evening = Update on Pending Delivery Alerts)'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

jobs:
  delivery-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f streamlit_app/requirements.txt ]; then
            pip install -r streamlit_app/requirements.txt
          else
            pip install -r requirements.txt
          fi

      - name: Run combined delivery alert job
        env:
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:     ${{ secrets.EMAIL_PASSWORD }}
          CRM_EMAIL_SENDER:   ${{ secrets.CRM_EMAIL_SENDER }}    # sends all CRM mail
          CRM_EMAIL_PASSWORD: ${{ secrets.CRM_EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS:   ${{ secrets.EMAIL_RECIPIENTS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          OPS_SPREADSHEET_ID: ${{ secrets.OPS_SPREADSHEET_ID }}
        run: |
          cd streamlit_app

          # Map cron schedule → SLOT.  Manual dispatch uses the input directly.
          SCHEDULE="${{ github.event.schedule }}"
          MANUAL="${{ github.event.inputs.slot }}"

          if   [ "$SCHEDULE" = "35 15 * * *" ]; then export SLOT=morning
          elif [ -n "$MANUAL"               ]; then export SLOT=$MANUAL
          fi

          echo "SLOT=${SLOT:-unset}  SCHEDULE=${SCHEDULE:-manual}  MANUAL=${MANUAL:-}"
          python email_job.py
