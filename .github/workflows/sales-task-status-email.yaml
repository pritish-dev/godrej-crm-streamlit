name: Sales Team Task Status Email (9 PM)

on:
  schedule:
    # All times in UTC. IST = UTC + 5:30
    # Triple-fire window to absorb GitHub Actions cron drift; the script
    # itself is idempotent via was_email_sent_today() — only the first
    # successful run actually sends.
    # CRM mail goes out only after 9 PM IST (was 6 PM).
    - cron: '30 15 * * *'   # 15:30 UTC = 21:00 IST  (primary)
    - cron: '50 15 * * *'   # 15:50 UTC = 21:20 IST  (drift backup)

  # Allow manual trigger from GitHub Actions UI for testing
  workflow_dispatch:

concurrency:
  group: sales-task-status-email-evening
  cancel-in-progress: false

jobs:
  # ── SALES TEAM TASK STATUS EMAIL ───────────────────────────────────────────
  sales-task-status-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if [ -f streamlit_app/requirements.txt ]; then
            pip install -r streamlit_app/requirements.txt
          else
            pip install -r requirements.txt
          fi

      - name: Run Sales Team Task Status Email Job
        env:
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:     ${{ secrets.EMAIL_PASSWORD }}
          CRM_EMAIL_SENDER:   ${{ secrets.CRM_EMAIL_SENDER }}    # sends all CRM mail
          CRM_EMAIL_PASSWORD: ${{ secrets.CRM_EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS:   ${{ secrets.EMAIL_RECIPIENTS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          OPS_SPREADSHEET_ID: ${{ secrets.OPS_SPREADSHEET_ID }}
        run: |
          cd streamlit_app
          python sales_tasks_status_email_job.py
