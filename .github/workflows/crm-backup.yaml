name: CRM + OPS Daily Backup

on:
  schedule:
    # 10:00 PM IST = 16:30 UTC
    - cron: '30 16 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Set to true to test without actual Drive changes'
        required: false
        default: 'false'

jobs:
  crm-backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f streamlit_app/requirements.txt ]; then
            pip install -r streamlit_app/requirements.txt
          else
            pip install -r requirements.txt
          fi

      - name: Run CRM + OPS daily backup
        env:
          GOOGLE_CREDENTIALS:           ${{ secrets.GOOGLE_CREDENTIALS }}
          CRM_BACKUP_DRIVE_FOLDER_ID:   ${{ secrets.CRM_BACKUP_DRIVE_FOLDER_ID }}
          # Optional — defaults to CRM_BACKUP_DRIVE_FOLDER_ID when not set.
          OPS_BACKUP_DRIVE_FOLDER_ID:   ${{ secrets.OPS_BACKUP_DRIVE_FOLDER_ID }}
          OPS_SPREADSHEET_ID:           ${{ secrets.OPS_SPREADSHEET_ID }}
          # Optional — user OAuth credentials. On a PERSONAL Google Drive a
          # service account has no storage, so set these to have backups owned
          # by (and counted against) your own 15 GB account. Add either
          # GOOGLE_OAUTH_TOKEN (full authorized-user JSON) OR the three below.
          GOOGLE_OAUTH_TOKEN:           ${{ secrets.GOOGLE_OAUTH_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID:       ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET:   ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN:   ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          cd streamlit_app
          python backup_job.py
