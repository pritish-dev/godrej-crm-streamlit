name: Build Android APK

# Builds the WebView wrapper APK for free on GitHub's runners and publishes it
# as a downloadable Release asset. The APK just opens the live Streamlit site,
# so it always mirrors the web dashboard — no code duplication, nothing to keep
# in sync by hand.
#
# Triggers:
#   - Manual "Run workflow" button (workflow_dispatch) — build on demand.
#   - Any push to master that touches the android app or this workflow.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "android_app/**"
      - ".github/workflows/build-android-apk.yaml"

permissions:
  contents: write   # needed to publish the Release with the APK attached

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK (debug-signed release)
        working-directory: android_app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android_app/app/build/outputs/apk -name "*.apk" | head -n1)
          echo "Found APK at: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodrejCRM-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish downloadable Release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Godrej CRM Android App (latest)"
          body: |
            Latest Godrej Interio CRM Android app.

            This APK opens the live Streamlit dashboard, so it always shows the
            same features as the web app. Download `app-release.apk` below.

            **Install:** on your phone, open this APK and allow "install from
            unknown sources" if prompted (Settings are one-time). Then open the
            "Godrej Interio CRM" app from your home screen.
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
