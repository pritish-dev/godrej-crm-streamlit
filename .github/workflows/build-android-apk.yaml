name: Build Android APK

# Builds the 4S CRM Android app on GitHub's free runners and publishes it as a
# Release asset with a stable download link:
#   https://github.com/pritish-dev/godrej-crm-streamlit/releases/download/android-latest/4S-CRM.apk
#
# The APK opens the live CRM (via the shared app shell), so dashboard changes
# NEVER need a new APK — Streamlit Cloud redeploys on every push and every phone
# sees it on next open. Rebuild only for native changes (icon, splash, URLs…).
# When a new APK is published, installed apps show an "Update available" prompt
# (they read version.json from the same release).
#
# Triggers:
#   - Manual "Run workflow" button (workflow_dispatch) — build on demand.
#   - Any push to master that touches the android app or this workflow.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "android_app/**"
      - "crm_app/**"
      - ".github/workflows/build-android-apk.yaml"

permissions:
  contents: write   # needed to publish the Release with the APK attached

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # +100 keeps every CI build above the original hand-numbered versionCode 1.
      - name: Compute version code
        run: echo "VERSION_CODE=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package was removed from Google's SDK repo; the
          # Android Gradle plugin downloads the platform/build-tools it needs.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed release APK
        working-directory: android_app
        env:
          # Optional: use your own private signing key from repo secrets.
          # Leave unset to use the fixed key committed in android_app/keystore.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          fi
          gradle assembleRelease -PappVersionCode="$VERSION_CODE" --no-daemon --stacktrace

      - name: Prepare release files
        run: |
          APK=$(find android_app/app/build/outputs/apk/release -name "*.apk" | head -n1)
          test -n "$APK" || { echo "::error::No APK produced"; exit 1; }
          mkdir -p dist
          cp "$APK" dist/4S-CRM.apk
          cp "$APK" dist/app-release.apk      # keeps older shared links working
          REPO_URL="https://github.com/${{ github.repository }}"
          cat > dist/version.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "2.$VERSION_CODE",
            "apkUrl": "$REPO_URL/releases/download/android-latest/4S-CRM.apk",
            "notes": ""
          }
          EOF
          cat dist/version.json

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4S-CRM-apk
          path: dist/4S-CRM.apk
          if-no-files-found: error

      - name: Publish downloadable Release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "4S CRM Android App (latest)"
          make_latest: true
          body: |
            Latest 4S CRM Android app — build ${{ env.VERSION_CODE }}.

            **Download:** `4S-CRM.apk` below (open this page on the phone).

            **Install:** tap the APK and allow "install from unknown sources" if
            prompted (one-time). Open **4S CRM** from the home screen and sign in
            with your ordering-app username and password.

            The app always shows the live CRM — dashboard updates appear
            automatically. When a new APK is published, the app offers the
            update itself.

            iPhone users: open https://pritish-dev.github.io/godrej-crm-streamlit/
            in Safari → Share → Add to Home Screen.
          files: |
            dist/4S-CRM.apk
            dist/app-release.apk
            dist/version.json
          fail_on_unmatched_files: true
