name: CRM Godown Undelivered Items Reminder

# Runs daily at 10 AM IST. All times UTC; IST = UTC + 5:30.
#
# The job (godown_undelivered_reminder_job.py):
#   1. Refreshes the "4s Godown Undelivered Items" OPS sheet — re-pulls each
#      item's Sales Person + Delivery Status from the CRM Franchise sheets and
#      merges in the salespeople's saved Remarks / Final Delivery Date.
#   2. Sends the "4S Godown Undelivered Items Reminder" email listing every
#      undelivered item whose Final Delivery Date is within 7 days (overdue
#      items included, in red).
#
# A same-day EMAIL_LOG guard inside the job prevents a duplicate send if the
# drift-backup cron below also fires.

on:
  schedule:
    - cron: '30 4 * * *'   # 04:30 UTC = 10:00 IST  (primary)
    - cron: '55 4 * * *'   # 04:55 UTC = 10:25 IST  (drift backup)

  workflow_dispatch: {}

# Cancel an older in-flight run if a new one is queued in the same window
concurrency:
  group: godown-undelivered-reminder-email
  cancel-in-progress: false

jobs:
  godown-undelivered-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f streamlit_app/requirements.txt ]; then
            pip install -r streamlit_app/requirements.txt
          else
            pip install -r requirements.txt
          fi

      - name: Run Godown undelivered reminder job
        env:
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:     ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS:   ${{ secrets.EMAIL_RECIPIENTS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          cd streamlit_app
          python godown_undelivered_reminder_job.py
