name: Sales Team Tasks Email (STOPPED — manual only)

on:
  # Scheduled runs STOPPED — run manually from the Actions tab if ever needed.

  workflow_dispatch:

# Cancel any in-flight run from an earlier cron in the same window
concurrency:
  group: sales-tasks-email-morning
  cancel-in-progress: false

jobs:
  sales-tasks-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f streamlit_app/requirements.txt ]; then
            pip install -r streamlit_app/requirements.txt
          else
            pip install -r requirements.txt
          fi

      - name: Run sales team tasks email
        # Single-purpose workflow: only the nightly crons above trigger it.
        # No SLOT logic needed — the script always runs the same email.
        env:
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:     ${{ secrets.EMAIL_PASSWORD }}
          CRM_EMAIL_SENDER:   ${{ secrets.CRM_EMAIL_SENDER }}    # sends all CRM mail
          CRM_EMAIL_PASSWORD: ${{ secrets.CRM_EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS:   ${{ secrets.EMAIL_RECIPIENTS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          OPS_SPREADSHEET_ID: ${{ secrets.OPS_SPREADSHEET_ID }}
        run: |
          cd streamlit_app
          python sales_tasks_email_job.py
