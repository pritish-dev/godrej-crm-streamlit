name: Sales Team Tasks Email (Tomorrow's Plan, 9:30 PM)

on:
  schedule:
    # All times UTC. IST = UTC+5:30
    # CRM mail goes out only after 9 PM IST, so this is now the night-before
    # briefing: TOMORROW's tasks + overdue (was 9 AM for the same day).
    # GitHub Actions crons are best-effort (5–30 min drift); the backup cron
    # is a no-op once the first run has logged a send (was_email_sent_today).
    - cron: '0 16 * * *'    # 16:00 UTC = 21:30 IST  (primary)
    - cron: '20 16 * * *'   # 16:20 UTC = 21:50 IST  (drift backup)

  workflow_dispatch:

# Cancel any in-flight run from an earlier cron in the same window
concurrency:
  group: sales-tasks-email-morning
  cancel-in-progress: false

jobs:
  sales-tasks-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f streamlit_app/requirements.txt ]; then
            pip install -r streamlit_app/requirements.txt
          else
            pip install -r requirements.txt
          fi

      - name: Run sales team tasks email
        # Single-purpose workflow: only the nightly crons above trigger it.
        # No SLOT logic needed — the script always runs the same email.
        env:
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:     ${{ secrets.EMAIL_PASSWORD }}
          CRM_EMAIL_SENDER:   ${{ secrets.CRM_EMAIL_SENDER }}    # sends all CRM mail
          CRM_EMAIL_PASSWORD: ${{ secrets.CRM_EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS:   ${{ secrets.EMAIL_RECIPIENTS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          OPS_SPREADSHEET_ID: ${{ secrets.OPS_SPREADSHEET_ID }}
        run: |
          cd streamlit_app
          python sales_tasks_email_job.py
